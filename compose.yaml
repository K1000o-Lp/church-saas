services:
  postgres:
    image: postgres:17-alpine
    container_name: church-saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-church_saas}
      POSTGRES_USER: ${DB_USERNAME:-church}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-church_local}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-church} -d ${DB_DATABASE:-church_saas}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
